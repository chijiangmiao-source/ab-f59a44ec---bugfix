server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 健康检查端点（供 Docker HEALTHCHECK 与 Compose 使用）
    location = /healthz {
        default_type text/plain;
        return 200 'ok';
    }

    # 静态资源：存在即返回，缓存 1 小时
    location /assets/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # 单页应用回退：所有路径交给 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
